name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-test:
    name: Lint, Test & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Download sing-box and drivers (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          .\scripts\download-singbox.ps1

      - name: Download sing-box (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          chmod +x ./scripts/download-singbox.sh
          ./scripts/download-singbox.sh

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Tests
        run: cargo test --no-default-features --verbose

      - name: Build Desktop Executable
        run: cargo build --package rustybox --bin rustybox --verbose

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustybox-build-${{ matrix.os }}
          path: |
            target/debug/rustybox.exe
            target/debug/rustybox
            bin/sing-box.exe
            bin/sing-box
            bin/wintun.dll
          if-no-files-found: warn
