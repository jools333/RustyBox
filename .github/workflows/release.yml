name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.3)'
        required: true
        default: 'v0.1.3'

permissions:
  contents: write

jobs:
  release:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-x86_64'
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: 'linux-x86_64'
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Download sing-box and drivers (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          .\scripts\download-singbox.ps1

      - name: Download sing-box (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          chmod +x ./scripts/download-singbox.sh
          ./scripts/download-singbox.sh

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Tauri app & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tauriScript: "npx @tauri-apps/cli"
          tagName: "${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          releaseName: "RustyBox ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          releaseBody: 'Automated release of RustyBox desktop VPN client for Windows (.exe / .msi) and Linux (.deb / .AppImage).'
          releaseDraft: false
          prerelease: false
