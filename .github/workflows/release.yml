name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.23)'
        required: true
        default: 'v0.1.23'

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create or Update Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          name: "RustyBox ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          body: 'Automated release of RustyBox desktop VPN client for Windows (.exe / .msi), Linux (.deb / .AppImage), and macOS (.dmg / .app).'
          draft: false
          prerelease: false

  release:
    name: Build (${{ matrix.platform }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-x86_64'
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: 'linux-x86_64'
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: 'macos-aarch64'
            os: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
            singbox_arch: 'arm64'
          - platform: 'macos-x86_64'
            os: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
            singbox_arch: 'amd64'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Download sing-box and drivers (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          .\scripts\download-singbox.ps1

      - name: Download sing-box (Linux / macOS)
        if: matrix.os == 'ubuntu-22.04' || matrix.os == 'macos-latest'
        run: |
          chmod +x ./scripts/download-singbox.sh
          ./scripts/download-singbox.sh 1.14.3 bin ${{ matrix.singbox_arch || '' }}

      - name: Install frontend dependencies
        shell: bash
        run: |
          rm -f package-lock.json frontend/package-lock.json
          npm install --no-audit --no-fund

      - name: Build Tauri app & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tauriScript: "npx @tauri-apps/cli"
          args: ${{ matrix.args || '' }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: "${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          releaseName: "RustyBox ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          releaseBody: 'Automated release of RustyBox desktop VPN client for Windows (.exe / .msi), Linux (.deb / .AppImage), and macOS (.dmg / .app).'
          releaseDraft: false
          prerelease: false

  release-android:
    name: Build (android-apk)
    needs: create-release
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
          yes | ${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125"
          echo "NDK_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install frontend dependencies & build
        shell: bash
        run: |
          rm -f package-lock.json frontend/package-lock.json
          npm install --no-audit --no-fund
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build libbox.aar for Android
        run: |
          mkdir -p src-tauri/plugins/rustybox-vpn/android/libs
          export PATH="$(go env GOPATH)/bin:$PATH"
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.4
          gomobile init
          git clone --depth 1 --branch v1.11.4 https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box
          go run ./cmd/internal/build_libbox -target android -platform android/arm64
          cp libbox.aar "$GITHUB_WORKSPACE/src-tauri/plugins/rustybox-vpn/android/libs/libbox.aar"

      - name: Initialize & Build Android APK
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx @tauri-apps/cli android init --ci
          fi
          npx @tauri-apps/cli android build --apk --target aarch64

      - name: Sign Android APK
        run: |
          APK_DIR="src-tauri/gen/android/app/build/outputs/apk/universal/release"
          UNSIGNED_APK=$(ls "$APK_DIR"/*.apk | head -n 1)
          SIGNED_APK="$APK_DIR/rustybox-android-arm64.apk"
          keytool -genkeypair -v -keystore /tmp/release.keystore -alias rustybox -keyalg RSA -keysize 2048 -validity 10000 -storepass rustybox -keypass rustybox -dname "CN=RustyBox,O=RustyBox,C=US"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          "$APKSIGNER" sign --ks /tmp/release.keystore --ks-pass pass:rustybox --key-pass pass:rustybox --ks-key-alias rustybox --out "$SIGNED_APK" "$UNSIGNED_APK"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          files: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/rustybox-android-arm64.apk
