[package]
name = "tauri-plugin-rustybox-vpn"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-rustybox-vpn"

[dependencies]
tauri = { version = "2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
